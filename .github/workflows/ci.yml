name: CI

# Test-only: this service runs locally on a LAN machine for QA token swap
# (the SongUpdaterQA target points at it on :8080). There is no hosted
# deployment, so there is nothing for CI to deploy — it exists to keep the
# routes honest.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
